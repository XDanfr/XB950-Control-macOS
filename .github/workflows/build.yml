name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test (Apple Silicon)
        run: >-
          xcodebuild test
          -project XB950Control.xcodeproj
          -scheme XB950Control
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO

      - name: Test (Intel)
        run: >-
          xcodebuild test
          -project XB950Control.xcodeproj
          -scheme XB950Control
          -destination 'platform=macOS,arch=x86_64'
          CODE_SIGNING_ALLOWED=NO

      - name: Verify universal Release build
        run: >-
          xcodebuild build
          -project XB950Control.xcodeproj
          -scheme XB950Control
          -configuration Release
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO